# Population genetics: 07_polymorphism.
# The packages the code uses, at the versions the paper used. popgen.exact.yml
# lists every package of that environment (linux-64). fetch_ena_reads.py also
# needs curl, which most systems already have.
#   conda env create -f envs/popgen.yml
name: popgen
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=2.4.6
  - pandas=3.0.5
  - scipy=1.17.1
  - matplotlib-base=3.11.1
  - bwa-mem2=2.3
  - samtools=1.24
  - bcftools=1.24
  - genmap=1.3.0
  - mosdepth=0.3.14
